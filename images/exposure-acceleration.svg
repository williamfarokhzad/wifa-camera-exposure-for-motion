<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><title>At rest initially, then moving during exposure</title><desc>Synthetic acceleration example from rest. At 0, 1, 2, 3 and 4 milliseconds the displacement bounds are 0, 0.01, 0.04, 0.09 and 0.16 millimeters.</desc><rect width="1200" height="760" fill="#eef5f1"/><g font-family="sans-serif" fill="#14383e"><text x="48" y="60" font-size="32" font-weight="700">At rest initially, then moving during exposure</text><text x="48" y="108" font-size="23">Initial speed: 0 mm/s · acceleration bound: 20000 mm/s²</text><text x="48" y="152" font-size="23">Local scale: 0.1 mm/pixel · horizontal positions share one scale</text><path d="M180 240H830" stroke="#bed5ca" stroke-width="2"/><path d="M586.25 216V264" stroke="#ba5a25" stroke-width="3" stroke-dasharray="6 6"/><circle cx="180" cy="240" r="11" fill="#087b72"/><text x="48" y="248" font-size="24">0 ms</text><text x="880" y="248" font-size="23">0.00 mm / 0.0 px</text><path d="M180 318H830" stroke="#bed5ca" stroke-width="2"/><path d="M586.25 294V342" stroke="#ba5a25" stroke-width="3" stroke-dasharray="6 6"/><circle cx="220.625" cy="318" r="11" fill="#087b72"/><text x="48" y="326" font-size="24">1 ms</text><text x="880" y="326" font-size="23">0.01 mm / 0.1 px</text><path d="M180 396H830" stroke="#bed5ca" stroke-width="2"/><path d="M586.25 372V420" stroke="#ba5a25" stroke-width="3" stroke-dasharray="6 6"/><circle cx="342.5" cy="396" r="11" fill="#087b72"/><text x="48" y="404" font-size="24">2 ms</text><text x="880" y="404" font-size="23">0.04 mm / 0.4 px</text><path d="M180 474H830" stroke="#bed5ca" stroke-width="2"/><path d="M586.25 450V498" stroke="#ba5a25" stroke-width="3" stroke-dasharray="6 6"/><circle cx="545.625" cy="474" r="11" fill="#087b72"/><text x="48" y="482" font-size="24">3 ms</text><text x="880" y="482" font-size="23">0.09 mm / 0.9 px</text><path d="M180 552H830" stroke="#bed5ca" stroke-width="2"/><path d="M586.25 528V576" stroke="#ba5a25" stroke-width="3" stroke-dasharray="6 6"/><circle cx="830" cy="552" r="11" fill="#087b72"/><text x="48" y="560" font-size="24">4 ms</text><text x="880" y="560" font-size="23">0.16 mm / 1.6 px</text><text x="665" y="640" font-size="22" fill="#a4481d">Dashed mark: 0.1 mm / 1 pixel</text><text x="48" y="692" font-size="23">At 4 ms: 0.5 × 20000 × 0.004² = 0.16 mm = 1.6 pixels.</text><text x="48" y="732" font-size="21">Synthetic path bound, not measured motion. Lens and shutter effects are excluded.</text></g></svg>